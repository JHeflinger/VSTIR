version: 1
name: sample_scene

camera:
  position: [-5.0, 1.0, 0.0]
  look: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  fov_degrees: 60.0
  orbiting: true
  orbit_target: [0.0, 0.0, 0.0]

meshes:
  - name: dragon
    obj: ../models/dragon.obj
    transform:
      translation: [0.0, 0.0, 0.0]
      rotation_degrees_xyz: [0, 45.0, 0]
      scale: [.05, .05, .05]
    material:
      Kd: [ 0.7, 0.7, 0.7 ]
      Ks: [ 0.0, 0.0, 0.0 ]
      Ni: 1.45
      Ns: 10
      illum: 2
  - name: box
    obj: ../models/EmptyBox.obj
    transform:
      scale: [1, 1, 1]